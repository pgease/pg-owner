<svg width="400" height="320" viewBox="0 0 400 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle / Glow -->
  <circle cx="200" cy="160" r="130" fill="#E6F3F3" />

  <!-- Main Dashboard Card -->
  <g filter="drop-shadow(0px 12px 24px rgba(0,0,0,0.1))">
    <rect x="80" y="55" width="240" height="195" rx="18" fill="#FFFFFF" />
    <!-- Top Bar -->
    <rect x="100" y="75" width="70" height="8" rx="4" fill="#1F2937" />
    <circle cx="295" cy="79" r="6" fill="#008080" />
    
    <!-- Donut Chart & Stat 1 -->
    <circle cx="140" cy="130" r="30" stroke="#E6F3F3" stroke-width="8" fill="none"/>
    <circle cx="140" cy="130" r="30" stroke="#008080" stroke-width="8" stroke-dasharray="140 190" stroke-linecap="round" fill="none"/>
    <text x="140" y="134" font-family="sans-serif" font-weight="800" font-size="12" fill="#1F2937" text-anchor="middle">92%</text>
    <text x="140" y="174" font-family="sans-serif" font-weight="600" font-size="9" fill="#6B7280" text-anchor="middle">Occupied</text>

    <!-- Mini Stat Cards Right -->
    <rect x="195" y="102" width="105" height="34" rx="8" fill="#E6F3F3" />
    <text x="205" y="117" font-family="sans-serif" font-weight="700" font-size="11" fill="#008080">4 Vacant Beds</text>
    <text x="205" y="129" font-family="sans-serif" font-size="8" fill="#6B7280">Ready to assign</text>

    <rect x="195" y="144" width="105" height="34" rx="8" fill="#FEF3C7" />
    <text x="205" y="159" font-family="sans-serif" font-weight="700" font-size="11" fill="#D97706">0 Rent Dues</text>
    <text x="205" y="171" font-family="sans-serif" font-size="8" fill="#92400E">100% On-Time</text>

    <!-- Bottom Bar / Complaints Banner -->
    <rect x="100" y="196" width="200" height="36" rx="8" fill="#1F2937" />
    <circle cx="120" cy="214" r="7" fill="#FFD166" />
    <path d="M117 214L119 216L123 212" stroke="#1F2937" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="135" y="217" font-family="sans-serif" font-weight="700" font-size="9" fill="#FFFFFF">Complaints Resolved: 8/8</text>
