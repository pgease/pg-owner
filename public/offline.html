<title>PG Ease – You're offline</title>
<style>
/* Self-contained: NO network requests. Poppins is bundled next to this file under fonts/ (falls back to system sans). */
@font-face{font-family:Poppins;font-weight:400;src:local("Poppins"),url(fonts/Poppins-Regular.ttf)}
@font-face{font-family:Poppins;font-weight:500;src:local("Poppins Medium"),url(fonts/Poppins-Medium.ttf)}
@font-face{font-family:Poppins;font-weight:600;src:local("Poppins SemiBold"),url(fonts/Poppins-SemiBold.ttf)}
:root{--teal:#008080;--teal-d:#005F5F;--teal-l:#E6F3F3;--ink:#1F2937;--bg:#FFFFFF}
@media (prefers-color-scheme:dark){:root{--bg:#0F1A1A;--ink:#F3F4F6;--teal-l:#12302F}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:Poppins,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:calc(env(safe-area-inset-top) + 24px) 24px calc(env(safe-area-inset-bottom) + 24px)}
.logo{height:34px;margin-bottom:20px}
.art{width:min(72vw,300px);aspect-ratio:1;border-radius:50%;background:var(--teal-l);display:grid;place-items:center;margin-bottom:22px}
.art img{width:92%;height:auto;margin-top:6%}
h1{font-size:22px;font-weight:600;margin-bottom:8px}
p{font-size:14px;line-height:1.6;opacity:.72;max-width:300px;margin-bottom:26px}
button{font:600 15px Poppins,system-ui,sans-serif;color:#fff;background:var(--teal);border:0;border-radius:14px;padding:14px 36px;min-width:200px;
  box-shadow:0 6px 16px rgba(0,128,128,.28);cursor:pointer;transition:transform .12s}
button:active{transform:scale(.97);background:var(--teal-d)}
button[disabled]{opacity:.7}
.hint{margin-top:16px;font-size:12px;opacity:.55;display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--teal);animation:p 1.4s infinite}
@keyframes p{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
</style></head>

})();
